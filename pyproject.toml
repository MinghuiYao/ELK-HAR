[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elk-har"
version = "0.2.0"
description = "Effective large-kernel CNNs for wearable human activity recognition"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Minghui Yao" }]
dependencies = ["torch>=1.13"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Repository = "https://github.com/MinghuiYao/ELK-HAR"
Issues = "https://github.com/MinghuiYao/ELK-HAR/issues"

[tool.setuptools]
py-modules = ["ELK_block", "Model"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
